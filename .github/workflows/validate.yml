name: Validate Project Pilot

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Verify runtime behavior
        run: python -m unittest discover -s tests -v
      - name: Check English repository content
        run: python scripts/check_english.py
      - name: Measure synthetic context payload
        run: python scripts/benchmark_context.py
