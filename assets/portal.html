<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Pilot</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e7edf5;background:#101725;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:28px 20px 70px}header{display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:28px}h2{font-size:19px;margin-top:0}.card{background:#192438;border:1px solid #31405b;border-radius:16px;padding:22px;margin:18px 0}.muted{color:#aebed5;font-size:14px}label{display:block;margin:14px 0 7px}input,select,textarea,button{font:inherit}textarea,input[type=text],select{width:100%;padding:11px;background:#101725;color:inherit;border:1px solid #536786;border-radius:8px}textarea{min-height:85px;resize:vertical}input[type=checkbox]{margin-inline-end:9px}button{background:#8de6cf;color:#092b24;border:0;padding:12px 18px;border-radius:9px;cursor:pointer;font-weight:650;margin-top:15px}button:disabled{opacity:.4;cursor:default}progress{width:100%;height:19px;accent-color:#8de6cf}.row{display:flex;justify-content:space-between;gap:16px}.feature{border-top:1px solid #31405b;padding:13px 0}.pill{display:inline-block;border:1px solid #536786;border-radius:20px;padding:3px 10px;margin:4px;font-size:13px}.question{padding:9px 0 18px;border-bottom:1px solid #31405b}svg{width:100%;min-width:650px}#graph{overflow:auto}svg text{fill:#edf5ff;font:13px system-ui}svg line{stroke:#7fa7c4;stroke-width:2}svg rect{fill:#233953;stroke:#8de6cf}a{color:#8de6cf}#message{position:sticky;top:8px;z-index:1;padding:12px;background:#263c54;border-radius:8px;display:none}.error{color:#ffb9aa}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.counts{font-variant-numeric:tabular-nums}.optionHint{padding-inline-start:16px}.warning{color:#ffda8b}@media(max-width:600px){header{display:block}.card{padding:16px}}
</style></head><body><main><header><h1 id="title">Project Pilot</h1><div><div id="connection" class="muted"></div><div id="updated" class="muted"></div></div></header><div id="message"></div>
<section class="card"><h2 id="progressTitle"></h2><div class="row"><span id="track1Label"></span><span id="track1Count" class="counts"></span></div><progress id="track1" max="100" value="0"></progress><div class="row"><span id="track2Label"></span><span id="track2Count" class="counts"></span></div><progress id="track2" max="100" value="0"></progress><p id="finalStatus" class="muted"></p></section>
<section class="card"><h2 id="ideaTitle"></h2><pre id="idea"></pre><div id="decisions"></div></section>
<section class="card"><h2 id="graphTitle"></h2><div id="graph"></div><div id="edgeReasons" class="muted"></div></section>
<section class="card"><h2 id="featuresTitle"></h2><div id="features"></div></section>
<section class="card" id="discovery"><h2 id="questionsTitle"></h2><p id="defaultHint" class="muted"></p><div id="questions"></div><h2 id="scopeTitle"></h2><select id="scopeMode"></select><div id="scope"></div><button id="adopt"></button><p id="adopted" class="muted"></p></section>
<section class="card"><h2 id="handoffTitle"></h2><pre id="handoff"></pre><div id="blockers" class="warning"></div></section>
<section class="card"><h2 id="plan2Title"></h2><p id="plan2Hint" class="muted"></p><div id="plan2"></div><button id="approvePlan2"></button></section>
<section class="card"><h2 id="deliveryTitle"></h2><div id="delivery"></div></section>
</main><script>
const token=new URLSearchParams(location.hash.slice(1)).get('token')||sessionStorage.getItem('pilotToken')||'';
if(token)sessionStorage.setItem('pilotToken',token);
history.replaceState(null,'',location.pathname);
let current,formSignature='',planSignature='',draftTimer,busy=false,dirty=false;
const byId=id=>document.getElementById(id);
const english={progress:'Progress',track1:'Track 1: locally verified',track2:'Both tracks verified',final:'Final verification',idea:'Approved idea and decisions',graph:'Feature dependencies',features:'Features',questions:'Decisions needing clarification',scope:'Implementation scope',all:'Implement and deliver everything',selected:'Choose feature groups',adopt:'Adopt answers and start execution',adopted:'Baseline adopted. Later changes belong in Plan 2.',defaults:'Unanswered questions use the displayed recommendations after adoption. Do not enter secrets.',handoff:'Current work and blockers',plan2:'Plan 2',plan2Hint:'New scenarios and later changes. Execution requires your approval after final verification.',approvePlan2:'Approve selected Plan 2 items for execution',delivery:'Delivery',connected:'Connected',disconnected:'Disconnected — showing last received state',updated:'Last update',pending:'Not started',inProgress:'In progress',blocked:'Blocked',track1Passed:'Track 1 passed',bothPassed:'Both tracks passed',recommendation:'Recommendation',custom:'Custom answer',blank:'Use recommendation',saved:'Saved locally',conflict:'The proposal changed. Review the latest page and submit again.',error:'Action failed',empty:'No items',lastAction:'Last action',nextAction:'Next action',approvedPlan2:'Plan 2 execution approved',saving:'Saving locally…'};
const label=key=>current?.labels?.[key]||english[key]||key;
const text=(id,value)=>byId(id).textContent=value??'';
function node(tag,value,container,attributes={}){const el=document.createElement(tag);el.textContent=value??'';Object.entries(attributes).forEach(([k,v])=>el.setAttribute(k,v));container?.append(el);return el;}
function flash(value,error=false){text('message',value);byId('message').className=error?'error':'';byId('message').style.display='block';}
function proposal(){return current.baseline?.proposal||current.proposal;}
function graph(){const box=byId('graph');box.replaceChildren();const features=proposal().features||[];const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');const height=Math.max(150,Math.ceil(features.length/3)*100);svg.setAttribute('viewBox',`0 0 900 ${height}`);const positions=new Map(features.map((f,i)=>[f.id,{x:35+(i%3)*300,y:25+Math.floor(i/3)*100}]));for(const edge of proposal().edges||[]){const a=positions.get(edge.from),b=positions.get(edge.to);if(!a||!b)continue;const line=document.createElementNS(ns,'line');line.setAttribute('x1',a.x+115);line.setAttribute('y1',a.y+24);line.setAttribute('x2',b.x+115);line.setAttribute('y2',b.y+24);const title=document.createElementNS(ns,'title');title.textContent=`${edge.from} → ${edge.to}: ${edge.reason}`;line.append(title);svg.append(line);}for(const f of features){const p=positions.get(f.id),g=document.createElementNS(ns,'g'),rect=document.createElementNS(ns,'rect'),t=document.createElementNS(ns,'text');for(const [key,value] of Object.entries({x:p.x,y:p.y,width:230,height:48,rx:10}))rect.setAttribute(key,value);t.setAttribute('x',p.x+115);t.setAttribute('y',p.y+29);t.setAttribute('text-anchor','middle');t.textContent=f.title.length>27?f.title.slice(0,26)+'…':f.title;const title=document.createElementNS(ns,'title');title.textContent=f.title;g.append(title,rect,t);svg.append(g);}box.append(svg);byId('edgeReasons').replaceChildren();for(const edge of proposal().edges||[])node('p',`${edge.from} → ${edge.to}: ${edge.reason}`,byId('edgeReasons'));}
function collectDraft(){const answers={};document.querySelectorAll('[data-question]').forEach(el=>{if(el.tagName==='TEXTAREA'&&el.value.trim())answers[el.dataset.question]=el.value;else if(!(el.dataset.question in answers))answers[el.dataset.question]=el.value;});return {answers,scopeMode:byId('scopeMode').value,selected:[...document.querySelectorAll('[data-feature]:checked')].map(el=>el.dataset.feature),items:[...document.querySelectorAll('[data-plan]:checked')].map(el=>({id:el.dataset.plan,proposal:byId('edit-'+el.dataset.plan).value}))};}
async function post(action,extra){const response=await fetch('/api/'+action,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({revision:current.revision,...extra})});const result=await response.json();if(!response.ok){if(response.status===409){await refresh();throw Error(label('conflict'));}throw Error(result.error||label('error'));}current=result;return result;}
function changed(){dirty=true;clearTimeout(draftTimer);draftTimer=setTimeout(saveDraft,450);}
async function saveDraft(){if(!dirty||busy)return;busy=true;const draft=collectDraft();try{await post('draft',{draft});dirty=false;flash(label('saved'));}catch(error){flash(error.message,true);}finally{busy=false;if(dirty)draftTimer=setTimeout(saveDraft,1500);}}
function renderForms(){const source=current.baseline?.questions||current.questions;const signature=JSON.stringify([!!current.baseline,source,current.proposal.features]);if(signature!==formSignature){formSignature=signature;const box=byId('questions');box.replaceChildren();const answers=current.baseline?.answers||current.userDraft?.answers||current.answers||{};for(const q of source){const wrapper=node('div','',box,{class:'question'});node('label',q.title,wrapper);if(q.description)node('p',q.description,wrapper,{class:'muted'});const select=node('select','',wrapper,{'data-question':q.id});node('option',label('blank'),select,{value:''});for(const option of q.options||[])node('option',option.label,select,{value:option.value});const custom=node('textarea','',wrapper,{'data-question':q.id,placeholder:label('custom')});const existing=answers[q.id];if((q.options||[]).some(o=>o.value===existing))select.value=existing;else custom.value=existing??'';node('p',`${label('recommendation')}: ${q.recommendation||q.default||''}`,wrapper,{class:'muted'});for(const option of q.options||[])if(option.description)node('p',`${option.label}: ${option.description}`,wrapper,{class:'muted optionHint'});select.disabled=!!current.baseline;custom.disabled=!!current.baseline;select.onchange=()=>{custom.value='';changed();};custom.oninput=changed;}const mode=byId('scopeMode');mode.replaceChildren();node('option',label('all'),mode,{value:'all'});node('option',label('selected'),mode,{value:'selected'});mode.value=current.userDraft?.scopeMode||'all';mode.disabled=!!current.baseline;mode.onchange=changed;const scope=byId('scope');scope.replaceChildren();for(const f of current.proposal.features.filter(f=>f.kind!=='secondary')){const wrapper=node('label','',scope);const cb=node('input','',wrapper,{type:'checkbox','data-feature':f.id});cb.checked=(current.baseline?.selected||current.userDraft?.selected||current.proposal.features.map(f=>f.id)).includes(f.id);cb.disabled=!!current.baseline;cb.onchange=changed;wrapper.append(document.createTextNode(f.title));}}
const signature2=JSON.stringify([current.plan2,current.finalChecks.status,!!current.plan2Approval]);if(signature2!==planSignature){planSignature=signature2;const box=byId('plan2');box.replaceChildren();for(const item of current.plan2){const wrapper=node('div','',box,{class:'question'}),lab=node('label','',wrapper),cb=node('input','',lab,{type:'checkbox','data-plan':item.id});lab.append(document.createTextNode(item.title));const draft=current.userDraft?.items?.find(i=>i.id===item.id);cb.checked=!!draft;cb.onchange=changed;node('p',item.description,wrapper);node('p',item.impact,wrapper,{class:'muted'});for(const option of item.options||[])node('p',typeof option==='string'?option:option.label,wrapper);const edit=node('textarea','',wrapper,{id:'edit-'+item.id});edit.value=draft?.proposal||item.proposal||'';edit.oninput=changed;}}
}
function render(){document.documentElement.lang=current.language;document.documentElement.dir=current.direction;document.title=current.title;text('title',current.title);for(const [id,key]of Object.entries({progressTitle:'progress',track1Label:'track1',track2Label:'track2',ideaTitle:'idea',graphTitle:'graph',featuresTitle:'features',questionsTitle:'questions',scopeTitle:'scope',defaultHint:'defaults',adopt:'adopt',handoffTitle:'handoff',plan2Title:'plan2',plan2Hint:'plan2Hint',approvePlan2:'approvePlan2',deliveryTitle:'delivery'}))text(id,label(key));text('updated',label('updated')+': '+new Date(current.updatedAt).toLocaleString(current.language));text('idea',proposal().idea);const primary=proposal().features.filter(f=>f.kind!=='secondary'&&(!current.baseline||current.baseline.selected.includes(f.id)));const passed=(f,track)=>current.progress[f.id]?.[track]?.status==='passed';const first=primary.filter(f=>passed(f,'track1')).length,second=primary.filter(f=>passed(f,'track1')&&passed(f,'track2')).length;for(const [key,count]of [['track1',first],['track2',second]]){const percent=primary.length?Math.round(count/primary.length*10000)/100:0;byId(key).value=percent;text(key+'Count',`${count} / ${primary.length} · ${percent}%`);}text('finalStatus',label('final')+': '+(current.finalChecks.summary||current.finalChecks.status));byId('features').replaceChildren();for(const f of primary){const wrapper=node('div','',byId('features'),{class:'feature'}),p=current.progress[f.id]||{};node('strong',f.title,wrapper);node('span',label(passed(f,'track2')&&passed(f,'track1')?'bothPassed':passed(f,'track1')?'track1Passed':p.status||'pending'),wrapper,{class:'pill'});for(const criterion of f.acceptance||[])node('p','• '+criterion,wrapper,{class:'muted'});if(p.nextCheck)node('p',p.nextCheck,wrapper,{class:'muted'});}byId('decisions').replaceChildren();for(const d of proposal().decisions||[])node('p',typeof d==='string'?d:JSON.stringify(d),byId('decisions'));graph();renderForms();text('adopted',current.baseline?label('adopted'):'');byId('adopt').disabled=!!current.baseline||!current.readyForAdoption;byId('approvePlan2').disabled=current.finalChecks.status!=='passed'||!!current.plan2Approval;if(current.plan2Approval)text('plan2Hint',label('approvedPlan2'));text('handoff',`${label('lastAction')}: ${current.handoff.lastAction}\n${label('nextAction')}: ${current.handoff.nextAction}`);byId('blockers').replaceChildren();for(const b of current.blockers)node('p',typeof b==='string'?b:b.description,byId('blockers'));byId('delivery').replaceChildren();for(const [key,value]of Object.entries(current.delivery))node('pre',`${key}: ${typeof value==='string'?value:JSON.stringify(value,null,2)}`,byId('delivery'));}
async function refresh(){try{const response=await fetch('/api/state',{headers:{Authorization:'Bearer '+token,...(current?{'If-None-Match':'"'+current.revision+'"'}:{})}});if(response.status===304){text('connection',label('connected'));return;}if(!response.ok)throw Error('Connection');const data=await response.json();if(!current||current.revision!==data.revision){current=data;render();}text('connection',label('connected'));}catch(error){text('connection',label('disconnected'));}}
byId('adopt').onclick=async()=>{if(busy)return;busy=true;clearTimeout(draftTimer);try{const draft=collectDraft();await post('adopt',draft);dirty=false;render();flash(label('saved'));}catch(e){flash(e.message,true);}finally{busy=false;}};
byId('approvePlan2').onclick=async()=>{if(busy)return;busy=true;try{await post('plan2',{items:collectDraft().items});dirty=false;render();flash(label('approvedPlan2'));}catch(e){flash(e.message,true);}finally{busy=false;}};
(async function poll(){if(!busy)await refresh();setTimeout(poll,2000);})();
</script></body></html>
